name: Verify exact certificates

on:
  push:
    paths:
      - '.github/workflows/verify.yml'
      - 'scripts/**'
      - '!scripts/vendor_lean.py'
      - '!scripts/check_lean.py'
      - 'certificates/**'
      - '!certificates/lean_source_manifest.json'
  pull_request:
    paths:
      - '.github/workflows/verify.yml'
      - 'scripts/**'
      - '!scripts/vendor_lean.py'
      - '!scripts/check_lean.py'
      - 'certificates/**'
      - '!certificates/lean_source_manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check all new finite inequalities
        run: python3 scripts/verify_current.py
